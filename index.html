<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kokou Eklou-Agnide - Resume</title>
  <style>
    :root {
      --text-main: #222222;
      --text-muted: #555555;
      --accent: #0f4c81;
      --border-color: #dddddd;
      --bg-page: #f9fafb;
      --bg-card: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: var(--text-main);
      background-color: var(--bg-page);
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--bg-card);
      padding: 3rem;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 1.25rem;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.5px;
      color: #111111;
      margin-bottom: 0.4rem;
    }

    .contact-info {
      font-size: 0.95rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .contact-info a {
      color: var(--accent);
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .separator {
      color: #aaa;
    }

      margin-bottom: 1.75rem;
    }
